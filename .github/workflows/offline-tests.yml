name: Offline harness checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    env:
      LOCALAPPDATA: /tmp/cait-gpt-tests
      FF7R_INPUT_BACKEND: simulation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "Tools/ff7r-codex-agent-mvp[dev]"
      - run: python scripts/check_distribution.py
      - run: python -m compileall -q Tools/ff7r-codex-agent-mvp/src
      - run: python -m pytest Tools/ff7r-codex-agent-mvp/tests -q
      - run: python -m unittest discover -s tests -v
        working-directory: Tools/ff7r-route-following-simulator
      - run: python -m unittest discover -s . -p 'test_*.py' -v
        working-directory: Tools/ff7r-navigation-validation
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
